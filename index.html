<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · Liquid Trucking Operations Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
.signin{flex:1;display:grid;place-items:start center;padding:48px 16px 64px}
.signin-in{width:100%;max-width:440px;display:grid;gap:16px}
.signin h1{font-size:2.3rem}
.msg{font-size:.85rem;min-height:1.2em;color:var(--muted)}
.msg.err{color:#b3261e}
</style>
</head>
<body>
<div id="ltTop" data-current="signin" data-crumbs="Sign in"></div>
<script src="/assets/nav.js"></script>

<main class="signin"><div class="signin-in">
  <div>
    <h1>Operations Center</h1>
    <p class="muted" style="margin:6px 0 0">Liquid Trucking's home for team tools: recruiting, onboarding and more as we build them.</p>
  </div>
  <section class="card" id="authCard" aria-labelledby="authTitle">
    <h2 id="authTitle">Sign in</h2>
    <div id="signedOut" style="display:grid;gap:10px">
      <p class="small muted" style="margin:0">Enter your work email and we'll send you a 6-digit code. No password needed.</p>
      <label class="field" for="otpEmail"><span>Email</span><input type="email" id="otpEmail" class="txt" autocomplete="email"></label>
      <div><button type="button" class="primary" id="sendCode">Email me a code</button></div>
      <div id="codeStep" hidden style="display:grid;gap:10px">
        <label class="field" for="otpCode"><span>Code from the email</span><input type="text" id="otpCode" class="txt" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></label>
        <div><button type="button" class="primary" id="verifyCode">Sign in</button></div>
      </div>
    </div>
    <div id="signedIn" hidden style="display:grid;gap:10px">
      <p id="whoText" style="margin:0"></p>
      <div><button type="button" id="signOut">Sign out</button></div>
    </div>
    <div class="msg" id="authMsg" role="status"></div>
  </section>
</div></main>

<div id="ltFoot"></div>
<script>ltDrawShell()</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script src="/assets/portal.js"></script>
<script>
const $=id=>document.getElementById(id);
// Where to go after sign-in: ?next=/some/page on this site, otherwise the dashboard.
const NEXT=(()=>{ const n=new URLSearchParams(location.search).get("next")||""; return /^\/(?!\/)/.test(n)?n:"/dashboard"; })();

async function route(){
  const {email,acct,offline}=await ltLoadAccount();
  if(offline){ $("authMsg").textContent="Couldn't reach the sign-in service. Refresh to try again."; return; }
  if(email&&acct&&acct.active!==false){ location.replace(NEXT); return; }
  $("signedOut").hidden=!!email; $("signedIn").hidden=!email; $("authTitle").textContent=email?"Your account":"Sign in";
  if(email) $("whoText").innerHTML=!acct
    ?`You're signed in as <b>${ltEsc(email)}</b>, but this email hasn't been added as a user yet. Ask an admin to add you.`
    :`You're signed in as <b>${ltEsc(acct.name)}</b>, but your account is turned off. Ask an admin to turn it back on.`;
}

$("sendCode").onclick=async()=>{
  const email=$("otpEmail").value.trim().toLowerCase(), msg=$("authMsg");
  if(!email){ msg.textContent="Enter your email first."; return; }
  msg.className="msg"; msg.textContent="Sending…";
  const {error}=await ltClient().auth.signInWithOtp({email,options:{shouldCreateUser:true}});
  if(error){ msg.className="msg err"; msg.textContent="Couldn't send the code: "+error.message; return; }
  msg.textContent="Code sent to "+email+". It can take a minute to arrive; check Junk too.";
  $("codeStep").hidden=false; $("otpCode").focus();
};
$("otpEmail").addEventListener("keydown",e=>{ if(e.key==="Enter") $("sendCode").click(); });
$("verifyCode").onclick=async()=>{
  const email=$("otpEmail").value.trim().toLowerCase(), token=$("otpCode").value.replace(/\s/g,""), msg=$("authMsg");
  if(!token) return;
  msg.className="msg"; msg.textContent="Checking…";
  const {error}=await ltClient().auth.verifyOtp({email,token,type:"email"});
  if(error){ msg.className="msg err"; msg.textContent="That code didn't work. Codes expire after an hour, so request a new one if needed."; return; }
  msg.textContent=""; await route();
};
$("otpCode").addEventListener("keydown",e=>{ if(e.key==="Enter") $("verifyCode").click(); });
$("signOut").onclick=async()=>{ await ltClient().auth.signOut(); location.replace("/"); };
route();
</script>
</body>
</html>
